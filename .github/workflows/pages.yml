name: Research — verify static app

on:
  push:
    branches: [research]
  pull_request:
    branches: [research]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Verify static hourly coverage for every map corridor
        run: python3 tools/check_zone_price_traces.py
      - run: python3 tools/check_public_assets.py
      - run: bun run build
      - name: Install Chromium for interaction checks
        run: bunx playwright install --with-deps chromium
      - name: Verify the production static site in Chromium
        env:
          SMOKE_URL: http://127.0.0.1:4180/grid-conductor/
        run: |
          mkdir -p /tmp/grid-conductor-preview
          ln -s "$GITHUB_WORKSPACE/dist" /tmp/grid-conductor-preview/grid-conductor
          python3 -m http.server 4180 --bind 127.0.0.1 --directory /tmp/grid-conductor-preview > /tmp/grid-conductor-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail "$SMOKE_URL" > /dev/null; then break; fi
            sleep 1
          done
          bun run test:browser
          bun tools/math-browser-smoke.ts
          bun tools/country-browser-smoke.ts
