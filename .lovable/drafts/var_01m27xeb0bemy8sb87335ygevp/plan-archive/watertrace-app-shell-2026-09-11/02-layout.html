<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: var(--font-sans); fill: hsl(var(--foreground)); }
    .lbl { font-size: 14px; font-weight: 480; }
    .note { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .mono { font-family: var(--font-mono); font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .fillq { fill: hsl(var(--muted)); stroke: none; }
  </style>

  <!-- desktop frame -->
  <rect class="bx" x="8" y="24" width="400" height="252" rx="8"/>

  <text class="lbl" x="22" y="47">WaterTrace</text>
  <rect x="240" y="33" width="96" height="18" rx="9" fill="hsl(var(--accent))"/>
  <text class="note" x="252" y="46" style="fill: hsl(var(--accent-foreground))">zone: DK-DK1</text>
  <rect class="bx" x="348" y="33" width="46" height="18" rx="9"/>
  <text class="note" x="356" y="46">theme</text>

  <!-- sidebar -->
  <rect class="bx" x="9" y="59" width="118" height="216"/>
  <g>
    <rect class="fillq" x="21" y="72" width="82" height="9" rx="4"/>
    <rect class="fillq" x="21" y="90" width="94" height="9" rx="4"/>
    <rect class="fillq" x="21" y="108" width="74" height="9" rx="4"/>
    <rect class="fillq" x="21" y="126" width="90" height="9" rx="4"/>
    <rect class="fillq" x="21" y="144" width="80" height="9" rx="4"/>
    <rect class="fillq" x="21" y="162" width="70" height="9" rx="4"/>
    <rect class="fillq" x="21" y="180" width="88" height="9" rx="4"/>
    <rect class="fillq" x="21" y="198" width="76" height="9" rx="4"/>
  </g>
  <text class="note" x="21" y="228">8 pages</text>

  <!-- content -->
  <rect class="bx" x="140" y="72" width="120" height="64" rx="8"/>
  <text class="lbl" x="152" y="98">W1  3.42</text>
  <text class="note" x="152" y="116">L/kWh · LIVE</text>
  <rect class="bx" x="272" y="72" width="120" height="64" rx="8"/>
  <text class="note" x="284" y="98">SignalCard</text>
  <rect class="bx" x="140" y="148" width="252" height="72" rx="8"/>

  <rect class="zone" x="140" y="232" width="252" height="30" rx="8"/>

  <!-- mobile frame -->
  <rect class="bx" x="452" y="24" width="150" height="252" rx="8"/>
  <text class="note" x="452" y="18">mobile</text>
  <rect class="fillq" x="453" y="25" width="148" height="30"/>
  <rect class="bx" x="453" y="25" width="148" height="30"/>
  <text class="note" x="464" y="44">WaterTrace</text>
  <rect class="bx" x="464" y="68" width="126" height="52" rx="8"/>
  <text class="note" x="476" y="98">SignalCard</text>
  <rect class="bx" x="464" y="132" width="126" height="52" rx="8"/>
